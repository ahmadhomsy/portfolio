name: portfolio_flutter
description: Professional Portfolio Website
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  animated_text_kit: ^4.2.2
  app_links: ^7.0.0
  bloc: ^9.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.3.0
  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^10.6.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^6.1.0
  logger: ^2.6.2
  lucide_icons: ^0.257.0
  scroll_to_index: ^3.0.1
  url_launcher: ^6.2.2
  very_good_analysis: ^10.1.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/bmi_calculator/
    - assets/images/simple_chat_app/
    - assets/images/weather/
    - assets/images/quiz_app/
    - assets/images/daily_done/
    - assets/images/sham_booking/