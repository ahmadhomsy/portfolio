name: Flutter Web CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: Flutter Web CI/CD
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter project
        run: flutter analyze

      # Note on Automated Tests:
      # The repository currently lacks an authentic automated test suite. The existing
      # test file (test/widget_test.dart) is an unadapted default starter smoke test
      # from 'flutter create' that does not match MyPortfolio and fails if executed.
      # Once authentic unit/widget tests are added and the starter file is resolved,
      # uncomment the step below to enforce test execution in CI:
      #
      # - name: Run Flutter tests
      #   run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Setup Node.js for Netlify CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Deploy to Netlify Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes netlify-cli@27.9.0 deploy --prod --dir=build/web --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
